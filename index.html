<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>iPhone</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  }

  .device {
    position: relative;
    width: 390px;
    height: 844px;
    border-radius: 55px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 0 12px #1c1c1e, 0 0 0 14px #3a3a3c, 0 40px 80px rgba(0,0,0,0.6);
  }

  /* ===== 상태바 ===== */
  .statusbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 26px 11px 32px;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    z-index: 50;
  }

  .sb-icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* 신호 */
  .signal {
    display: flex;
    align-items: flex-end;
    gap: 1.5px;
    height: 11px;
  }
  .signal i {
    width: 3px;
    background: #fff;
    border-radius: 1px;
    display: block;
  }
  .signal i:nth-child(1) { height: 3.5px; }
  .signal i:nth-child(2) { height: 5.5px; }
  .signal i:nth-child(3) { height: 7.5px; }
  .signal i:nth-child(4) { height: 10px; }

  /* 와이파이 */
  .wifi {
    width: 14px;
    height: 10px;
    position: relative;
  }
  .wifi::before {
    content: "";
    position: absolute;
    left: 50%; bottom: 0;
    transform: translateX(-50%) rotate(-45deg);
    width: 5px; height: 5px;
    border: 2px solid #fff;
    border-radius: 50%;
    border-bottom-color: transparent;
    border-left-color: transparent;
  }
  .wifi::after {
    content: "";
    position: absolute;
    left: 50%; bottom: 1px;
    transform: translateX(-50%);
    width: 2.5px; height: 2.5px;
    background: #fff;
    border-radius: 50%;
  }

  /* 배터리 */
  .battery {
    width: 23px;
    height: 10.5px;
    border: 1.4px solid #fff;
    border-radius: 2.5px;
    padding: 1.3px;
    position: relative;
  }
  .battery::after {
    content: "";
    position: absolute;
    right: -3.5px;
    top: 2.8px;
    width: 1.8px;
    height: 4.5px;
    background: #fff;
    border-radius: 0 1px 1px 0;
  }
  .battery-level {
    height: 100%;
    width: 75%;
    background: #fff;
    border-radius: 1px;
  }

  .screens { position: absolute; inset: 0; }

  /* ===== 잠금화면 ===== */
  .lockscreen {
    position: absolute;
    inset: 0;
    background: url('IMG_5280.jpeg') center/cover no-repeat;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 118px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    transition: transform 0.45s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .lockscreen.hide {
    transform: translateY(-110%);
  }

  .lock-time {
    font-size: 86px;
    font-weight: 300;
    letter-spacing: -2.5px;
    line-height: 1;
  }

  .lock-date {
    font-size: 19px;
    font-weight: 500;
    margin-top: 5px;
  }

  .dday {
    margin-top: 13px;
    font-size: 14.5px;
    font-weight: 600;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 4px 13px;
    border-radius: 20px;
  }

  .lock-bottom {
    position: absolute;
    bottom: 46px;
    font-size: 13.5px;
    font-weight: 500;
    opacity: 0.85;
  }

  /* ===== 비밀번호 ===== */
  .passcode {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 40;
  }
  .passcode.show { display: flex; }

  .passcode-title {
    font-size: 16.5px;
    margin-bottom: 26px;
  }

  .dots {
    display: flex;
    gap: 16px;
    margin-bottom: 36px;
    transition: transform 0.15s;
  }
  .dots span {
    width: 12px;
    height: 12px;
    border: 1.7px solid #fff;
    border-radius: 50%;
  }
  .dots span.fill {
    background: #fff;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 76px);
    gap: 15px 20px;
  }
  .keypad button {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: rgba(255,255,255,0.17);
    color: #fff;
    font-size: 30px;
    border: none;
  }
  .keypad button:active {
    background: rgba(255,255,255,0.32);
  }

  .home {
    position: absolute;
    inset: 0;
    background: url('IMG_5280.jpeg') center/cover no-repeat;
    display: none;
  }
  .home.show { display: block; }

  .homebar {
    position: absolute;
    bottom: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 5px;
    background: #fff;
    border-radius: 3px;
    z-index: 30;
  }
</style>
</head>
<body>

<div class="device">
  <!-- 상태바 -->
  <div class="statusbar">
    <span id="sbTime">--:--</span>
    <div class="sb-icons">
      <div class="signal"><i></i><i></i><i></i><i></i></div>
      <div class="wifi"></div>
      <div class="battery"><div class="battery-level"></div></div>
    </div>
  </div>

  <div class="screens">
    <!-- 잠금화면 -->
    <div class="lockscreen" id="lockscreen">
      <div class="lock-time" id="time">--:--</div>
      <div class="lock-date" id="date">--월 --일 ---</div>
      <div class="dday" id="dday">♡ D+0</div>
      <div class="lock-bottom">위로 밀어서 잠금 해제</div>
    </div>

    <!-- 비밀번호 -->
    <div class="passcode" id="passcode">
      <div class="passcode-title">암호 입력</div>
      <div class="dots" id="dots">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="keypad" id="keypad"></div>
    </div>

    <!-- 홈화면 -->
    <div class="home" id="home"></div>
  </div>

  <div class="homebar"></div>
</div>

<script>
  const PASSWORD = "0501";
  const BASE_DATE = "2025-05-01";

  function getKoreaTime() {
    return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Seoul" }));
  }

  function updateTime() {
    const now = getKoreaTime();
    const h = String(now.getHours()).padStart(2, "0");
    const m = String(now.getMinutes()).padStart(2, "0");
    document.getElementById("time").textContent = `${h}:${m}`;
    document.getElementById("sbTime").textContent = `${h}:${m}`;

    const days = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
    document.getElementById("date").textContent = 
      `${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}`;
  }

  function updateDday() {
    const base = new Date(BASE_DATE + "T00:00:00+09:00");
    const today = getKoreaTime();
    const baseDay = new Date(base.getFullYear(), base.getMonth(), base.getDate());
    const todayDay = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const diffDays = Math.floor((todayDay - baseDay) / (1000*60*60*24));

    const el = document.getElementById("dday");
    if (diffDays === 0) el.textContent = "♡ D-Day";
    else if (diffDays > 0) el.textContent = `♡ D+${diffDays}`;
    else el.textContent = `♡ D${diffDays}`;
  }

  updateTime();
  updateDday();
  setInterval(updateTime, 1000);

  // 스와이프
  let startY = 0;
  const lock = document.getElementById("lockscreen");
  lock.addEventListener("touchstart", e => startY = e.touches[0].clientY, {passive:true});
  lock.addEventListener("touchend", e => {
    if (startY - e.changedTouches[0].clientY > 70) {
      document.getElementById("passcode").classList.add("show");
    }
  });

  // PC용
  let mouseY = 0;
  lock.addEventListener("mousedown", e => mouseY = e.clientY);
  lock.addEventListener("mouseup", e => {
    if (mouseY - e.clientY > 70) {
      document.getElementById("passcode").classList.add("show");
    }
  });

  // 키패드
  const keypad = document.getElementById("keypad");
  let input = "";
  for (let i=1; i<=9; i++) {
    const b = document.createElement("button");
    b.textContent = i;
    b.onclick = () => press(String(i));
    keypad.appendChild(b);
  }
  keypad.appendChild(document.createElement("div"));
  const zero = document.createElement("button");
  zero.textContent = "0";
  zero.onclick = () => press("0");
  keypad.appendChild(zero);
  keypad.appendChild(document.createElement("div"));

  function press(n) {
    if (input.length >= 4) return;
    input += n;
    document.querySelectorAll("#dots span").forEach((d,i) => {
      d.classList.toggle("fill", i < input.length);
    });
    if (input.length === 4) {
      setTimeout(() => {
        if (input === PASSWORD) {
          document.getElementById("passcode").classList.remove("show");
          lock.classList.add("hide");
          document.getElementById("home").classList.add("show");
        } else {
          input = "";
          document.querySelectorAll("#dots span").forEach(d => d.classList.remove("fill"));
          const dots = document.getElementById("dots");
          dots.style.transform = "translateX(-6px)";
          setTimeout(() => dots.style.transform = "translateX(6px)", 70);
          setTimeout(() => dots.style.transform = "translateX(0)", 140);
        }
      }, 150);
    }
  }
</script>
</body>
</html>
